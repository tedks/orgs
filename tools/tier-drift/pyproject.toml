[project]
name = "tier-drift"
version = "0.1.0"
description = "Tracks how the model tier your agent work needs drifts downward as capabilities improve, and recommends dispatch changes."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
tier-drift = "tier_drift.__main__:main"

# A dependency group, not an optional extra: uv syncs the dev group by
# default, so `uv run pytest` works in a fresh worktree with no setup step.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tier_drift"]

[tool.ruff]
target-version = "py312"
line-length = 100
# collector.py is piped over ssh to hosts running whatever python3 they
# have, as old as 3.6. It is checked against that floor in tests, not here.
extend-exclude = ["src/tier_drift/collector.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
