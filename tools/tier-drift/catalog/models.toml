[benchmarks.terminal-bench-science-0-1]
name = "Terminal-Bench-Science 0.1"

[benchmarks.frontier-bench-0-1]
name = "Frontier-Bench v0.1"

[benchmarks.frontiercode-1-1-main]
name = "FrontierCode 1.1 (Main)"

[benchmarks.frontiercode-1-1-extended]
name = "FrontierCode 1.1 (Extended)"

[benchmarks.arc-agi-2]
name = "ARC-AGI-2"

[benchmarks.arc-agi-3]
name = "ARC-AGI-3"

[benchmarks.gpqa-diamond]
name = "GPQA Diamond"

[benchmarks.hle-tools]
name = "Humanity's Last Exam (with tools)"

[benchmarks.gdpval-aa-v2]
