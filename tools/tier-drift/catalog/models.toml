# tier-drift model catalog.
#
# This is the one input you edit by hand. When a model ships, add an entry
# and re-run; `tier-drift` also warns about any model it sees in your logs
# that is missing here.
#
# Rules this file is held to (catalog.py validates them):
#   - Every score names its SOURCE. The same model's SWE-bench Verified score
#     was measured 12 points apart by different sources, so insights only
#     treat a comparison as strong when both scores share a source.
#   - Leave a field out rather than guess. A missing price or release date
#     makes the model drop out of the insights that need it, which is
#     correct; an invented one produces a confident wrong recommendation.
#   - cache_read_basis says whether a cached-input rate was published or is
#     assumed at one tenth of input. Cached reads are routinely over 95% of
#     a long agentic workload's input tokens, so the difference matters.
#
# tier: 1 cheap, 2 mid, 3 flagship, 4 frontier. It is a price class within
#   a vendor, not a capability ranking: claude-opus-5 (tier 3) outscores
#   claude-fable-5 (tier 4) on SWE-bench Verified.
# status: active | legacy (still served, older) | superseded (a newer model
#   exists; availability unconfirmed) | deprecated | retired
# successor: a same-vendor model that is a drop-in upgrade at the same or
#   lower price. Only set it when that is true.

catalog_version = 1
as_of = "2026-09-21"

# ----------------------------------------------------------------- sources

[sources.anthropic]
kind = "vendor"
name = "Anthropic release notes and launch announcements"
url = "https://platform.claude.com/docs/en/release-notes/overview"

[sources.anthropic-system-card]
kind = "vendor"
name = "Anthropic system card (averaged over repeated trials)"

[sources.openai]
kind = "vendor"
name = "OpenAI launch benchmark tables"
url = "https://openai.com/index/gpt-6-astra/"

[sources.aggregate]
kind = "third-party"
name = "Third-party benchmark aggregators (harness varies by site)"

[sources.arc-prize]
kind = "third-party"
name = "ARC Prize Foundation"

# -------------------------------------------------------------- benchmarks

[benchmarks.swe-bench-verified]
name = "SWE-bench Verified"
note = "Saturating above 95% and contaminated: some tasks' gold patches were in training data."

[benchmarks.swe-bench-pro]
name = "SWE-bench Pro"
note = "Scale AI's contamination-resistant successor to SWE-bench Verified."

