id: agent-tooling-guard-wrapper-grammar
title: Broaden documented destructive guard wrapper grammar
desc: 'Follow up on the public destructive-command guard grammar after agent-tooling
  PR54: recognize common command-position wrappers such as timeout options (-s, --foreground),
  time -p, nohup and nice without treating brace expansion inside operands as separators.
  Keep accidental-action scope explicit; add synthetic deny/allow cases and focused
  mutation checks. Current simple timeout DURATION form is documented and tested;
  this is a nonblocking council nit.'
