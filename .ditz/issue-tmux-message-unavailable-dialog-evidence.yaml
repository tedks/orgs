id: tmux-message-unavailable-dialog-evidence
title: Decide evidence bar for unavailable Claude update and feedback dialogs
desc: 'Question for the dotfiles CTO: What evidence is required to mark PR #10 ready
  when the Claude Code 2.1.302 update dialog and unsent-feedback exit dialog could
  not be induced in the authorized scratch session?


  Options:

  1. Keep PR #10 draft and capture each dialog on a later real occurrence.

  2. Accept clearly labeled synthetic dialog fixtures based on existing wording and
  mark the PR ready.

  3. Accept fail-closed unknown-layout behavior for these unavailable dialogs, with
  no fixture claim, and mark the PR ready.


  Recommendation: option 3 if the code review and exact-SHA gates are clean. Both
  public and legacy senders require a positively identified live composer before any
  input; unfamiliar dialog layouts therefore defer. Keep the missing authentic captures
  explicit in the PR. Do not fabricate a real capture.


  Decision owner: dotfiles CTO. This blocks the evidence disposition and whether PR
  #10 can move from draft to ready, not further classifier work or local tests.'
