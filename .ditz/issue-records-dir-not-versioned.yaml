id: records-dir-not-versioned
title: 'Private project records dir is not version-controlled: chaos controller-tools/
  holds shards, receipts and the readiness ledger but is not a git worktree and has
  no private remote, so the doctrine rule ''shard committed to a private location
  and pushed where a private remote is configured'' cannot be met there and a disk
  loss erases the org''s memory. Doctrine should require records dirs to be a private
  repo (or the off-duty repo) and the cold-start audit should check it.'
