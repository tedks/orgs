id: external-window-kill-no-record
title: 'Two live Codex lanes (chaos B at 17:57:30 EDT, chaos W at 18:35:52 EDT on
  2026-09-26) died mid-turn with their worker sessions, no shutdown record, no retirement
  entry, no peer pane showing an exit; the CEO says he did not close them. Both fell
  inside an interval of manual tmux work in the same session (clearing another lane''s
  composer); a Codex composer exits on Ctrl-D. Doctrine/binding gaps: (1) no way to
  attribute a window kill after the fact (tmux has no audit log; propose a pane-exit
  hook that records pane id, pid, time and foreground command to the records dir);
  (2) the roster should record each lane''s ROOT rollout id (spawn produces sibling
  files; the CTO recorded a sibling); (3) recovery procedure (fork of the root session
  with a resume brief) should be in the binding; (4) human tmux work inside a session
  with live lanes needs a stated keystroke-safety rule.'
