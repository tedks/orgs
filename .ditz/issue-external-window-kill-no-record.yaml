  comment: 'Evidence 2026-09-26 evening: hygiene tmux snapshots show the killed pane
    present 12 s before death with no hygiene action on it; harness-control lifecycle
    exits touched only private smoke processes; every death (17:57:30, 18:35:52, 19:13:21)
    coincides with a human working in that tmux session, and a plain top window died
    the way top dies on Ctrl-C. Codex TUI quits on a second Ctrl-C within its window.
    Add to doctrine/binding: humans clear an agent composer with Esc or Backspace,
    never Ctrl-C; and a pane-exit hook to record kills.'
