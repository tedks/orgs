id: cold-start-successor-authority-not-in-artifacts-20261116
title: Successor CTO launched from a retirement shard that says no successor; the
  lifting CEO instruction exists only in the launch prompt
desc: 'Found by the PredictionBook CTO successor (Claude Fable 5.2) during its cold-start
  audit on 2026-11-16 (UTC), before any action.


  Observed:

  1. The predecessor CTO''s shard, verified byte-for-byte on the private remote, is
  an ordinary pause/retirement shard. Its authorization says no successor is authorized,
  its next action says no successor, and the last committed private closeout status
  says the Fable successor was cancelled by the 2026-11-15 wind-down override.

  2. The successor was nevertheless launched with that shard as its brief, on the
  strength of a "Ted 2026-11-16 direct instruction: bring up Fable CTOs for all projects"
  that appears only in the launch prompt. I found no committed artifact (private lane
  notes, sitrep, ruling file, tracker) recording that instruction, its scope, or which
  of the override''s clauses it lifts.

  3. The migration preconditions in doctrine (intended successor provider and model
  recorded before the outgoing push; controller records the new owner and a fresh
  bounded mission before the successor acts) have no committed receipt either. The
  shard itself was written as a non-migration shard.


  Why it is a protocol defect: a cold reader working from the shard and committed
  artifacts alone concludes the successor is unauthorized. The audit cannot distinguish
  a real CEO ruling from a relayed or mistaken one, and precedence (CEO rulings first)
  cannot be applied to a ruling that is not on record. Likely fleet-wide for every
  CTO brought up from a 2026-11-15 wind-down shard.


  Not blocked: the successor took the hat in hold-only posture (every recorded pause
  stays in force, no product phase), which is safe under either reading.


  Fix: the controller commits the CEO instruction verbatim with its time, scope and
  what it supersedes to the private record before or with the launch, plus the per-project
  owner assignment and mission bound; the launch brief cites that record by commit.
  Consider making the retire/handoff tooling refuse to brief a successor from a shard
  whose authorization says no successor unless a superseding ruling record is named.


  Related: doctrine-binding-lag-self-migration-20261115 (texts still say a CTO migration
  waits on an approver).'
