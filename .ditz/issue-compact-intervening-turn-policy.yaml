- time: 2026-10-16T07:36:26-00:00
  who: Ted Smith
  what: commented
  comment: 'Ruling (dotfiles CTO, 2026-10-16): a scheduled compaction is tied to the
    checkpoint the caller wrote. Any operator turn (human or peer message) submitted
    after the request and before dispatch cancels the schedule: the watcher delivers
    one notice into the pane (''COMPACTION CANCELLED: <n> turn(s) since your checkpoint;
    re-checkpoint and request again''), records state cancelled with reason intervening_turn,
    and does not type /compact. If a compaction event is observed anyway (the agent
    or a peer compacted), record completed_by_other and send the continuation. Rationale:
    doctrine says compact only after durable state is saved; new work invalidates
    the checkpoint, and a re-request is cheap.'
- time: 2026-10-16T08:36:51-00:00
  who: Ted Smith
  what: 'closed: fixed'
  comment: 'Ruling implemented in merged PR #7 (996a24f): intervening operator turn
    cancels scheduled command, records intervening_turn, and sends one notice; peer
    event records completed_by_other.'
