id: compact-intervening-turn-policy
title: Decide scheduled compact behavior after intervening operator turns
desc: 'Context: PR #7 self_compact watcher can re-arm and follow new root turns after
  the checkpoint receipt. The saved checkpoint may then omit work from the intervening
  turn, or an operator may have said not to compact without calling cancel_operation.

  Options: (A) Cancel/defer the scheduled compact when a new operator turn begins
  and require a fresh checkpoint. (B) Continue following later turns and compact with
  the original checkpoint.

  Recommendation: A, because the continuation must point to a current checkpoint.
  The native queue path already defers conservatively because queue events can precede
  the current turn''s completion.

  Decision owner: Ted. Blocks: product contract and merge of agent-skills PR #7. No
  live affected pane may be used to test the ruling.'
