- time: 2026-11-15T01:29:34-00:00
  who: Ted Smith
  what: commented
  comment: 'CTO contract ruling: accept an explicit operator-configured stable account
    scope per provider as a local namespace, not provider-authenticated identity.
    Missing scope disables comparison/notification. A scope change requires explicit
    configuration, starts a fresh isolated baseline and cannot manufacture a reset;
    preserve old dedup evidence. Document that an unreported account change under
    unchanged scope cannot be detected with the current producer. Deployment owner
    must bind observations to the declared scope; do not infer identity from descriptive
    source strings.

    Delivery contract: destination selection remains with Ted. Pluggable command may
    expose only the receipt it actually proves. Without destination idempotency or
    a reconciliation receipt, durably mark an event in flight before the external
    effect and serialize senders; a crash/timeout with uncertain delivery remains
    unknown, with no automatic retry. Retry only when evidence establishes no delivery,
    or when a destination idempotency key makes retry safe. This prioritizes the requested
    duplicate suppression, does not promise guaranteed delivery, and must be tested
    on both crash sides. Do not silently accept automatic replay after an ambiguous
    send. Keep the implementation small; no generalized queue platform.'
- time: 2026-11-15T01:39:54-00:00
  who: Ted Smith
  what: commented
  comment: 'First checkpoint reviewed at draft PR #53 head 659591a9a8a14d9915fe9e0c8411165cace3dee0.
    Additive per-reading account scope/epoch bound at source ingestion is accepted;
    no export-time relabeling. CTO requested removal or evidence-based justification
    of the unrequested five-percentage-point detection threshold (positive low-usage
    reset fixture), and return-to-source A/B/A coverage so source transitions cannot
    resurrect an old baseline into a reset claim. Lead reports 10 behavior tests and
    five killed mutations; exact final-head gates and formal council remain pending.
    Notification destination remains an open question; no live send or deployment
    claimed.'
- time: 2026-11-15T01:42:38-00:00
  who: Ted Smith
  what: commented
  comment: 'CTO ruling: allow one observed-replenishment alert after a long gap, with
    honest temporal uncertainty; no arbitrary one-window age cutoff on a valid historical
    baseline. Require a baseline originally accepted as valid/fresh, a fresh ordered
    later source observation within the same continuous account scope/epoch and source
    contract, passed prior deadline, advanced new deadline and measurable usage reduction.
    All transition-baseline, missing identity, stale/future/out-of-order post-reading
    and dedup guards remain. Retained history is evidence about the past, not a claim
    that old data is current. Timestamp passage, an export of saved values, offline
    status or elapsed time alone cannot generate an alert. Wording: replenishment
    observed since the last reading; include the two observation times and current
    measured remaining quota. Do not assert reset happened now, a particular cycle,
    or a count of missed cycles. At most one notification for the newly observed replenishment
    event; do not backfill speculative missed-cycle alerts. If continuity or producer
    freshness cannot be established, baseline only. Add positive long-gap/fresh-post
    test paired with stale/offline and identity/source-transition negatives. Deployment/notification
    destination remains unapproved pending Ted''s channel choice.'
