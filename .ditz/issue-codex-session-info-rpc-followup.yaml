id: codex-session-info-rpc-followup
title: Document and regression-test session-info RPC compatibility
desc: 'Track two nonblocking refinements from PR #62. Add a packaged RPC regression
  for the unchanged Claude get_session_info hook and sessions-index response. Clarify
