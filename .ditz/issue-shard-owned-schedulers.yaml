id: shard-owned-schedulers
title: 'Handoff shard omits owned schedulers: a CTO''s standup cron (crontab lines
  targeting its tmux window by name) was not in the 2026-09-26 chaos CTO shard and
  was found only via crontab -l; the retiring window name then dangles. Add owned
  schedulers/timers (crontab, systemd timers, /loop) to the shard''s owned-resources
  list in DOCTRINE retirement and the shard template, with their release or retarget.'
