id: tmux-fallback-diagnostics
title: Consider diagnostics when active tmux context fails its liveness probe
desc: 'PR #43 round3 Anthropic N2 suggests making an active-socket fallback visible.
  The user expressly approved falling through after a dead/unresponsive active server.
  Consider a diagnostic or structured status that identifies this transition without
  corrupting command/protocol stdout or flooding every helper call; account for private
  socket paths. Deferred because adding operator-visible output policy is separate
  from the bounded precedence/liveness correction. Existing explicit pins and ongoing
  operation identity remain authoritative.'
