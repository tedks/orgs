id: daemon-client-lifecycle-proof-20261111
title: Support bounded lifecycle proof for daemon-attached Codex clients
desc: Preserve the existing unique-rollout-FD proof and fail closed when an alternate
  native status plus exact task mapping is unavailable. Implement the negative and
  acceptance fixtures in docs/research/diy-hrt-retirement-retro-20261111.md. Keep
  private recovery, task archival, process end, and shell collection as separate states.
  Verify on a disposable native CLI before enabling the alternate path. This issue
  grants no diy-hrt research or live control authority.
