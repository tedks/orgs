  what: commented
  comment: 'PR47 light review caught and repaired an acceptance-test contradiction:
    an empty resume argument or misleading cwd must neither establish nor override
    native identity. The complete independent pinned-client/native-status/exact-idle-task
    proof may still succeed; hints alone fail. Keep this as a paired fixture, not
    a blanket rejection for missing resume argv. Read-only native status acquisition
    has its own pinned-target/human-input protections and never authorizes exit before
    identity is established.'
