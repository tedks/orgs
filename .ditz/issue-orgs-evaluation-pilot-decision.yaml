id: orgs-evaluation-pilot-decision
title: Decide whether to run a bounded Orgs evaluation pilot
desc: 'Decision owner: Ted (product scope and any model spend).

  Options: (A) authorize a bounded, preregistered local feasibility pilot with independent
  grader and a capped model budget; (B) refine the task corpus and examiner first;
  (C) defer comparative evaluation.

  Recommendation: first validate the examiner, arm isolation, mechanism delivery,
  and cost capture on a small seeded semantic-conflict pilot before approving a larger
  study. No run or spend is authorized by this issue.

  Blocks: execution of a comparative benchmark campaign, not completion of the private
  proposal.'
