id: council-invocation-measurement
title: Tally argument/mode mistakes over the first ten PR council rounds
desc: 'CEO ruling 5 (2026-11-03): count argument or mode mistakes in the next ten
  real councils, in round records, as evidence for further interface change. Convention
  (skills/council-review/references/pr-rounds.md, Invocation measurement): unit =
  one completed round (a round id with a valid v1 open record and at least one outcome
  record, counted once however often re-posted; abandoned open-only rounds excluded);
  window = the first ten such rounds across all repositories ordered by open-record
  GitHub time, starting with the first v1 open record; no per-PR reset; mistakes =
  each round''s invocation.corrections (refused-then-corrected invocations in the
  same session, recorded only as argument shape + refusal code); valid alias or branch
  routing is adoption, reported separately as alias_uses/notes. Fixture runs never
  contact GitHub and are never counted; this lane''s own PR #40 council used the baseline
  workflow and posts no v1 records. Known limit: refusals in a session that never
  completes a round are unobserved. Procedure: find PRs with records (gh search prs
  --owner <owner> ''council-review-round v1'' --json repository,number), run python3
  skills/council-review/scripts/council_pr.py tally OWNER/REPO#N ..., comment the
  table here as rounds accumulate. Completion evidence: a ditz comment with the tally
  output listing ten rounds (repo#PR, round id, shape, route, mistakes) and a recommendation
  (keep, or change the interface with cited rows). Owner: Orgs CTO; Utility-tier sweep
  acceptable for the tally itself.'
