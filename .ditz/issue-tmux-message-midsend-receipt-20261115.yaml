    of its historical executable identity. Therefore the actual UI failure shape required
    for a synthetic RED regression is missing. No reproducer, source fix, or old-delivery
    claim is made. Keep the pending files read-only and the issue open. Related tmux-message-enters0-stranded-paste
    describes Enter-count/status wording; spawn-agent-codex-0167-receipt-timeout describes
    a distinct fresh receipt-reconciliation class. Neither is assumed to explain this
    midsend failure.'
