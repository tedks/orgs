id: tmux-message-modal-footer-false-positive
title: 'tmux-message: modal detector fires on Claude Code footer text (usage limit,
  auto-update, feedback draft)'
desc: "Reported by the Chaos CTO (controller-tools-63, pane %685) on 2026-10-17; the
  dotfiles CTO owns tmux-message.\n\nWhat happened: from 2026-10-16 23:19Z to 2026-10-17
  00:31:52Z every `tmux-message send %685` from the XRW completion lead (10 attempts
  across two bounded loops) was deferred with reason `modal`; nothing was pasted.
  The CTO pane was not showing a dialog. It had hit its Anthropic usage limit and
  Claude Code's footer read \"Usage limit reached \xB7 continuing automatically at
  12pm \xB7 esc to cancel\", which matched the sender's modal pattern (\"Esc to cancel\").
  A launch-critical READY IDENTITY + PREFLIGHT message (b345ec4) stalled about two
  hours. Record: ~/Projects/chaos/controller-tools/lane-xrw-completion-20261013-record.md
  lines 232 and 256. Retained payloads: /tmp/tmux-message-wch02f6z, /tmp/tmux-message-0xc5krup,
  /tmp/tmux-message-ozugunsu (message files, 10-16 21:28-21:32 ET).\n\nOther Claude
  Code footer text that is not a modal and must not defer a send: \"\u2718 Auto-update
  failed: no write permission to npm prefix \xB7 Run claude doctor\" (seen on dotfiles
  %733 on 10-18 with \"new task? /clear to save 319.9k tokens \xB7 globalVersion:
  2.1.301 \xB7 latestVersion: 2.1.302\"), and the \"1 feedback draft\" count.\n\nAsk
  (Chaos CTO, verbatim): \"narrow the modal heuristic to actual dialog frames (the
  box glyphs plus a choice line), and treat known footers (usage limit, auto-update,
  feedback draft count) as non-modal; the misclassification stalled a launch-critical
  message for two hours.\"\n\nCode: skills/spawn-agent/scripts/claude-send.sh screen_state()
  (the 'Update available!' + 'Press enter to continue' and trust-prompt checks, then
  claude_trust_modal_active) and the modal/readiness classification in claude-send-screen.py
  and claude-pane-detect.sh. Real modals that must still defer: the trust prompt,
  the update \"Press enter to continue\" screen, permission prompts, the /exit \"Background
  work is running\" dialog, and the unsent-feedback-draft prompt (the latter two are
  separate issues on the dotfiles tracker: retire-agent-claude-exit-dialog, tmux-message-lifecycle-receipts;
  the placeholder deferral is tmux-message-claude-placeholder)."
