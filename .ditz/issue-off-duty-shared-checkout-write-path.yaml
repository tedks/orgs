    agent-skills commits are documentation only. The helper publishes exact bytes
    from a disposable worktree at a uniquely fetched remote master commit. Retire-agent
    stages shards and every receipt state privately, rebuilds the index and checks
    known-session duplicates on each retry, and verifies fetched remote bytes before
    exit. Harness-control checks remote presence against a fresh fetched commit.


