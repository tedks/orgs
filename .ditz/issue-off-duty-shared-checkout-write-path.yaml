id: off-duty-shared-checkout-write-path
title: 'retire-agent / shard writers: stop committing through the shared ~/Projects/off-duty
  checkout; push shards and receipts from a temporary worktree at origin/master'
desc: 'Reported by the Chaos CTO (controller-tools-63) 2026-10-19 02:16Z and hit by
  the dotfiles CTO three times on 2026-10-18: the shared ~/Projects/off-duty checkout
  on framework0 was ahead 1 (953da27, a shard already on origin as f57e552 by another
  path) and behind 119, with two retire-agent receipts (receipts/14da821f..., receipts/1909d438...)
  modified but uncommitted (state advanced from retirement-requested/deferred to pending-handoff/delivered),
  one untracked receipt (receipts/e29e2ec9...) and two untracked shards whose identical
  copies were already on origin. `git pull --rebase` refuses ("commit or stash"),
  `--autostash` fails ("could not detach HEAD"). Effect: every lane that follows the
  documented write-shard / pull --rebase / push sequence in the shared tree leaves
  its shard untracked or unpushed, and the shard check at retirement can pass against
  a local file that never reached the private remote.


  Fix (one agent-skills PR plus a one-line binding note in orgs): (1) a shared helper,
  e.g. skills/_shared/offduty-push.sh FILE... MESSAGE, that creates a temporary detached
  worktree of the off-duty repo at origin/master in the caller''s scratch area, copies
  the given files in, commits, pushes to origin master with a bounded retry on non-fast-forward
  (fetch, re-create the worktree, re-apply), removes the worktree, and prints the
  pushed commit; it never touches the shared checkout''s index or working tree. (2)
  retire-agent writes shards and receipts through that helper and verifies the shard
  by fetching origin/master, not by looking at the shared tree. (3) harness-control
  record_checkpoint''s remote_presence check keys on origin/master the same way. (4)
  The receipts writer must not leave uncommitted state in the shared tree: either
  commit through the helper or keep receipts under ~/.local/state and push only the
  final one. The dotfiles CTO repaired the shared checkout by hand on 2026-10-18 (salvage
  of the receipt states, then reset to origin/master); document that repair as the
  recovery procedure in the skill''s README.'
