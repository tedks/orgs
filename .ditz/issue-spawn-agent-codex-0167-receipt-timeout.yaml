  comment: 'Renewal P1 field report: three successor launches returned receipt-timeout
    while the receiver appeared to act on the brief; one additional handoff retained
    a launcher receipt gap. Treat as related evidence pending exact CLI/source/layout
    attribution, not proven same cause or verified transport delivery. Preserve spawned
    lanes; never relaunch/replay on timeout. Use independently attributed new application/native
    receipt fixtures and distinguish acknowledgement from the original sender result.
    Private payloads remain out of the tracker.'
