id: harness-control-cancel-review-nits
title: 'Triage residual PR #9 review nits'
desc: 'Residual non-blocking review points from the 2026-10-16 council:

  - The sender-lease refusal embeds blocker ID/state/remedy in reason text rather
  than structured fields. Consider structuring it for callers. The live observer must
  still hold serialization while the notice settles.

  - Explicit cancel replaces the previous reason; consider recording prior_reason
  for diagnostics. The current explicit_cancel reason satisfies the cancellation contract.

  - An observer started before the upgraded code may retain the old watching_other
  behavior across installation. Operational recovery is explicit cancellation of a
  pre-dispatch legacy record after the old observer exits; avoid mutating live records
  during upgrade.

  - Broader malformed-record hardening (e.g. failure_notice: null) can be considered
  separately. Current records are generated by the server; the reconciliation branch
  now tolerates null.

  These do not affect the fixed stale-cancel path or merge gate. Keep any hardening
  scoped and test behavior before changing result schemas.'
