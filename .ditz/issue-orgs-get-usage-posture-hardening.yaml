id: orgs-get-usage-posture-hardening
title: Harden get_usage posture consistency and task cleanup
desc: 'Nonblocking findings from orgs PR #34 final-sync council. The posture consumer
  validates the current token-usage JSON schema, but it does not cross-check expired
  meter names against staleness.stale, provider stale/gated flags, or bound the integer
  age. Add producer-contract fixtures for five-hour-only expiry and expired:null rejection.
  In get_usage, ensure the posture_task created before the try is awaited or cancelled
  if an unexpected exception escapes before the normal await. Keep fail-closed behavior
  and avoid adding private paths or session data to the public response. The current
  fix at 1736451 passed both council seats; this is follow-up hardening.'
type: task
