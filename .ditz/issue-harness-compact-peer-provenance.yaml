  who: Ted Smith
  what: commented
  comment: 'Recommended design (dotfiles CTO, 2026-10-16): native input carries no
    sender, so use a convention: a turn whose text begins with a configured control
    prefix (default CONTROL:, plus the org''s existing markers such as COMPACT ME,
    CONTINUE-, RETIRE-, listed in config) is not an intervening turn for a scheduled
    compaction; everything else cancels with the notice. Separate PR after the stale-cancel
    fix lands; add fixtures for both a control-prefixed turn and an ordinary one.'
