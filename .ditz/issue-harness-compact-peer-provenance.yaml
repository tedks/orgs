id: harness-compact-peer-provenance
title: Authenticate peer control messages before exempting them from compaction cancellation
desc: 'Question from the 2026-10-16 self_compact stale-cancel incident: Should a peer
  cross-session or tmux-delivered control message that merely tells a lane to compact
  count as an intervening operator turn? Options: (1) continue treating every native
  root input as intervening; (2) exempt messages whose text resembles control instructions;
  (3) add a sender-bound receipt that the observer can authenticate and exempt only
  those control deliveries. Recommendation: policy should exempt authenticated peer
  control messages, but retain option 1 until option 3 exists. Never use option 2
  because an operator can send identical text. Decider: Ted/CTO for the policy; harness-control
  owner for the provenance contract. Blocks reliable compaction after a peer reminder,
  but does not block the stale-cancel deadlock fix. Source: agent-skills issue harness-compact-stale-after-intervening-cancel,
  2026-10-16 incident.'
type: feature
component: open-questions
