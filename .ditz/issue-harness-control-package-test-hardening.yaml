id: harness-control-package-test-hardening
title: Harden harness-control package transport and isolation tests
desc: 'Strengthen the hermetic harness-control package tests after the initial Nix
  landing:


  - exercise tmux-message send as well as read against the private tmux server, including
  a reachable transport-file assertion;

  - add a stronger negative control that runs the wrapper through the package probe
  and demonstrates the probe catches an unisolated Python invocation.


  These are non-blocking test-depth improvements. The current package checks already
  cover a real MCP handshake, hostile Python environment variables, hostile user site
  and NIX_PYTHONPATH .pth injection, observer subprocess isolation, and private tmux
  read transport.'
type: task
