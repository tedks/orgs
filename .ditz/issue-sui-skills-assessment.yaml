desc: 'Lead mission, 2026-10-18. Measure Sui/Move/Walrus agent usage across framework0,
  tower0 and splinter1 for 2026-09-26 through 2026-10-18, then survey candidate skills,
  run bounded offline spot-checks, and recommend which to integrate. Evidence and
  reproducible fixture-tested measurement script land in docs/assessments/sui-skills-2026-10.md
