  comment: '2026-10-29 checkpoint: PR #13 is pushed at 9867cca and unmerged. Lead-tier
    council found a receipt ambiguity after changed-footer fallback: an archived unsent
    bold composer after a dropped Enter can have the same prompt/blank/indented-row
    screen shape as a genuine submitted row. Head 0c105da can falsely report delivered
    if a structured status changes to an unstructured one; broad exclusion instead
    risks receipt-timeout on genuine indented replies. Requested CTO product ruling,
    recommending fail closed. Relay to %321 deferred twice before paste, so the direct
    ruling request is pending. No M3 implementation started. Follow-ups tmux-message-codex-changed-footer-wrapped-paste
    and tmux-message-codex-bold-receipt-structure are filed.'
