id: cold-start-upgrade-tooling-evidence-20261117
title: Upgrade-tooling closeout cannot be verified from committed handoff evidence
desc: 'A cold-start audit of the paused upgrade-tooling lane reconstructed the pause,
  merged changes and the boundary against further action. The product repository''s
  committed execution diagnostic still listed an outcome of pending. In a separate
  private controller repository, committed closeout notes corroborated the gate and
  rehearsal totals, custody disposition and roster pause. The committed prerequisites
  plan also matched the shard''s digest and named follow-up issues. The shard itself
  pointed to host-local copies, requiring the reader to rediscover the committed controller
  artifacts.


  The remaining evidence gap is independent receipt verification: the underlying gate/council,
  rehearsal readback and resource-release records were cited through local paths,
  partial hashes or an external PR round. The final delta was called test-only in
  the shard even though it relocated an image-certificate check in production code
  and changed refusal diagnostics. The live rehearsal was on the earlier exact revision.


  Acceptance: the next closeout points from the shard to the existing private controller
  commit and final prerequisites plan, and indexes sanitized receipt artifacts or
  immutable committed references for the exact static and live heads and cleanup.
  Update the tracked diagnostic outcome or give it an immutable pointer to the final
  disposition. Include the roster disposition and decision owners and tracker links.
  A fresh reader using only the shard and committed artifacts should be able to check
  the evidence-to-head mapping and reconstruct authorized action. Keep session identifiers
  and raw receipts with private paths or custody details private. The pause remains
  in force and the audit itself assigns no package.


  Related: records-dir-not-versioned (general backing policy) and cold-start-successor-authority-not-in-artifacts-20261116
  (separate authority-provenance issue).'
type: bugfix
