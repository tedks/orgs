id: cold-start-upgrade-tooling-evidence-20261117
title: Upgrade-tooling closeout cannot be verified from committed handoff evidence
desc: 'During a cold-start audit of a paused upgrade-tooling lane, the retirement
  shard and commit graph established the pause, merged changes, and boundary against
  further action. The tracked execution diagnostic still reported an outcome of pending.
  The closeout summarized exact-head gates, live rehearsal and recovery, and resource
  release, but referenced host-local receipts and an external review round rather
  than a committed evidence index. A clean reader could repeat the claims but could
  not verify the evidence-to-head mapping, current decision links, or custody disposition
  from the committed handoff. The shard also called the final review delta test-only
  even though it relocated an image-certificate check in production code and changed
  refusal diagnostics. The runtime rehearsal applies to its earlier exact revision.


  Acceptance: publish a private committed closeout and evidence index, with sanitized
  receipt artifacts or immutable committed references and exact tested versus merged
  revisions. Update the tracked outcome or give it an immutable pointer to the final
  disposition, and include the roster disposition, owner of each remaining decision,
  and exact tracker links. A fresh reader using only the shard and committed artifacts
  should distinguish rehearsal results from static gates and reconstruct the pause
  and the next authorized action. Keep session identifiers, raw receipts with private
  paths, and custody details in private storage. The existing pause remains in force
  and an audit does not assign the package.


  Related: records-dir-not-versioned (general backing policy) and cold-start-successor-authority-not-in-artifacts-20261116
  (separate authority-provenance issue).'
type: bugfix
