  comment: 'Observed twice on 2026-10-16: the harness-compact lead (%711, 338 turns/h
    at 03:10) and the harness-cancel lead (%724, 348 turns/h at 13:40), both while
    running the native rehearsal and Nix gates. The work is fine; the shape is a loop
    of small tool calls. Wrap the rehearsal in a script that waits internally (until-loops
    with sleeps) and prints one result, so a lead spends one turn on it.'
